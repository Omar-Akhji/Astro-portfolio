<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0915" />
      <stop offset="100%" stop-color="#141226" />
    </linearGradient>
    <radialGradient id="glowGrad" cx="70%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="accentGlow" cx="20%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.4" />
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bgGrad)" />

  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" />
    </pattern>
    <rect width="800" height="600" fill="url(#grid)" />
  </g>

  <circle cx="560" cy="180" r="350" fill="url(#glowGrad)" />
  <circle cx="160" cy="480" r="300" fill="url(#accentGlow)" />

  <!-- Layout Container Graphic -->
  <g transform="translate(180, 100)">
    <rect x="0" y="0" width="440" height="240" rx="16" fill="url(#cardGrad)" stroke="url(#borderGrad)" stroke-width="2" />
    
    <!-- Dimension arrows -->
    <!-- Min-width indicator -->
    <line x1="40" y1="60" x2="140" y2="60" stroke="#3b82f6" stroke-width="2" stroke-dasharray="4 4" />
    <text x="90" y="50" font-family="sans-serif" font-size="12" fill="#60a5fa" text-anchor="middle">min-width: 320px</text>

    <!-- Max-width indicator -->
    <line x1="40" y1="120" x2="400" y2="120" stroke="#06b6d4" stroke-width="2" />
    <polygon points="40,116 30,120 40,124" fill="#06b6d4" />
    <polygon points="400,116 410,120 400,124" fill="#06b6d4" />
    <text x="220" y="110" font-family="sans-serif" font-size="13" fill="#38bdf8" text-anchor="middle" font-weight="600">max-width: 1200px (100% responsive)</text>

    <!-- Min-height indicator -->
    <line x1="380" y1="150" x2="380" y2="210" stroke="#a855f7" stroke-width="2" stroke-dasharray="4 4" />
    <text x="370" y="185" font-family="sans-serif" font-size="11" fill="#c084fc" text-anchor="end">min-height: 100vh</text>
  </g>

  <text x="70" y="430" font-family="'Montserrat', sans-serif" font-weight="700" font-size="30" fill="#ffffff" letter-spacing="-0.5">CSS Min/Max Width &amp; Height</text>
  <text x="70" y="470" font-family="'Montserrat', sans-serif" font-weight="500" font-size="16" fill="#38bdf8" letter-spacing="3" text-transform="uppercase">CSS &bull; Responsive Design</text>
  <text x="70" y="510" font-family="'Montserrat', sans-serif" font-weight="300" font-size="14" fill="#ffffff" opacity="0.4">Responsive Web Layouts Tutorial</text>
</svg>
