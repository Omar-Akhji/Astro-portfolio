<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 800 600"
  width="100%"
  height="100%"
>
  <defs>
    <!-- Background Gradient -->
    <linearGradient
      id="bgGrad"
      x1="0%"
      y1="0%"
      x2="100%"
      y2="100%"
    >
      <stop
        offset="0%"
        stop-color="#0a0915"
      />
      <stop
        offset="100%"
        stop-color="#141226"
      />
    </linearGradient>

    <!-- Glowing Mesh Gradient -->
    <radialGradient
      id="glowGrad"
      cx="70%"
      cy="30%"
      r="60%"
    >
      <stop
        offset="0%"
        stop-color="#8b5cf6"
        stop-opacity="0.25"
      />
      <stop
        offset="100%"
        stop-color="#ec4899"
        stop-opacity="0"
      />
    </radialGradient>

    <!-- Accent Glow -->
    <radialGradient
      id="accentGlow"
      cx="20%"
      cy="80%"
      r="50%"
    >
      <stop
        offset="0%"
        stop-color="#ec4899"
        stop-opacity="0.15"
      />
      <stop
        offset="100%"
        stop-color="#8b5cf6"
        stop-opacity="0"
      />
    </radialGradient>

    <!-- Glassmorphic Card Gradient -->
    <linearGradient
      id="cardGrad"
      x1="0%"
      y1="0%"
      x2="100%"
      y2="100%"
    >
      <stop
        offset="0%"
        stop-color="#ffffff"
        stop-opacity="0.07"
      />
      <stop
        offset="100%"
        stop-color="#ffffff"
        stop-opacity="0.02"
      />
    </linearGradient>

    <!-- Card Border -->
    <linearGradient
      id="borderGrad"
      x1="0%"
      y1="0%"
      x2="100%"
      y2="100%"
    >
      <stop
        offset="0%"
        stop-color="#ffffff"
        stop-opacity="0.15"
      />
      <stop
        offset="50%"
        stop-color="#ffffff"
        stop-opacity="0.02"
      />
      <stop
        offset="100%"
        stop-color="#8b5cf6"
        stop-opacity="0.3"
      />
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect
    width="800"
    height="600"
    fill="url(#bgGrad)"
  />

  <!-- Grid lines for high-tech aesthetic -->
  <g
    opacity="0.05"
    stroke="#ffffff"
    stroke-width="1"
  >
    <pattern
      id="grid"
      width="40"
      height="40"
      patternUnits="userSpaceOnUse"
    >
      <path
        d="M 40 0 L 0 0 0 40"
        fill="none"
      />
    </pattern>
    <rect
      width="800"
      height="600"
      fill="url(#grid)"
    />
  </g>

  <!-- Ambient Glows -->
  <circle
    cx="560"
    cy="180"
    r="350"
    fill="url(#glowGrad)"
  />
  <circle
    cx="160"
    cy="480"
    r="300"
    fill="url(#accentGlow)"
  />

  <!-- Abstract Modern Shapes / Interface elements -->
  <circle
    cx="400"
    cy="300"
    r="220"
    fill="none"
    stroke="#8b5cf6"
    stroke-opacity="0.08"
    stroke-width="2"
  />
  <circle
    cx="400"
    cy="300"
    r="222"
    fill="none"
    stroke="#ec4899"
    stroke-opacity="0.05"
    stroke-width="1"
    stroke-dasharray="10 15"
  />

  <!-- Tech Grid Element -->
  <g
    transform="translate(420, 240)"
    opacity="0.15"
  >
    <rect
      width="200"
      height="120"
      rx="10"
      fill="none"
      stroke="#ffffff"
      stroke-width="1.5"
    />
    <line
      x1="20"
      y1="30"
      x2="180"
      y2="30"
      stroke="#ffffff"
      stroke-width="1"
    />
    <circle
      cx="35"
      cy="15"
      r="5"
      fill="#8b5cf6"
    />
    <circle
      cx="55"
      cy="15"
      r="5"
      fill="#ec4899"
    />
    <rect
      x="20"
      y="50"
      width="100"
      height="8"
      rx="4"
      fill="#ffffff"
    />
    <rect
      x="20"
      y="70"
      width="140"
      height="8"
      rx="4"
      fill="#ffffff"
      opacity="0.5"
    />
    <rect
      x="20"
      y="90"
      width="80"
      height="8"
      rx="4"
      fill="#ffffff"
      opacity="0.3"
    />
  </g>

  <!-- Glassmorphic Dashboard Widget -->
  <rect
    x="100"
    y="120"
    width="350"
    height="220"
    rx="20"
    fill="url(#cardGrad)"
    stroke="url(#borderGrad)"
    stroke-width="1.5"
    style="backdrop-filter: blur(10px)"
  />
  <circle
    cx="140"
    cy="160"
    r="6"
    fill="#ff5f56"
  />
  <circle
    cx="160"
    cy="160"
    r="6"
    fill="#ffbd2e"
  />
  <circle
    cx="180"
    cy="160"
    r="6"
    fill="#27c93f"
  />

  <!-- Mini chart inside widget -->
  <path
    d="M 140 280 L 180 230 L 220 250 L 260 190 L 300 210 L 340 160 L 380 180"
    fill="none"
    stroke="url(#lineGrad)"
    stroke-width="4"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <linearGradient
    id="lineGrad"
    x1="0"
    y1="0"
    x2="1"
    y2="0"
  >
    <stop
      offset="0%"
      stop-color="#8b5cf6"
    />
    <stop
      offset="100%"
      stop-color="#ec4899"
    />
  </linearGradient>

  <!-- Title and Metadata -->
  <text
    x="70"
    y="440"
    font-family="'Montserrat', sans-serif"
    font-weight="700"
    font-size="36"
    fill="#ffffff"
    letter-spacing="-0.5"
  >
    The forgotten art of spacing
  </text>
  <text
    x="70"
    y="480"
    font-family="'Montserrat', sans-serif"
    font-weight="500"
    font-size="16"
    fill="#8b5cf6"
    letter-spacing="3"
    text-transform="uppercase"
  >
    Design
  </text>
  <text
    x="70"
    y="515"
    font-family="'Montserrat', sans-serif"
    font-weight="300"
    font-size="14"
    fill="#ffffff"
    opacity="0.4"
  >
    Omar Akhji &bull; Portfolio 2026
  </text>
</svg>
